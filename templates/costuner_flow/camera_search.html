{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Garud - Camera Search</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
        }
        
        .camera-app-wrapper {
            position: relative;
            width: 100%;
            max-width: 425px;
            height: 100%;
            background-color: #000;
            overflow: hidden;
        }

        #camera-feed {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            pointer-events: none;
        }

        .top-bar {
            padding: 24px;
            pointer-events: auto;
        }

        .close-btn {
            width: 40px;
            height: 40px;
            background-color: rgba(0, 0, 0, 0.4);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: none;
            cursor: pointer;
            backdrop-filter: blur(4px);
        }

        .close-btn svg {
            width: 24px;
            height: 24px;
            stroke: #fff;
            stroke-width: 2;
        }

        .scanner-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding-bottom: 20px;
        }

        .scanner-frame {
            width: 280px;
            height: 380px;
            border: 2px solid transparent;
            position: relative;
            margin-bottom: 40px;
        }

        /* Frame Corners */
        .scanner-frame::before, .scanner-frame::after {
            content: '';
            position: absolute;
            width: 40px;
            height: 40px;
            border-color: #fff;
            border-style: solid;
        }

        .scanner-frame::before {
            top: 0; left: 0;
            border-width: 3px 0 0 3px;
            border-top-left-radius: 20px;
        }

        .scanner-frame::after {
            bottom: 0; right: 0;
            border-width: 0 3px 3px 0;
            border-bottom-right-radius: 20px;
        }

        .scanner-frame-tr {
            position: absolute;
            top: 0; right: 0;
            width: 40px; height: 40px;
            border-color: #fff;
            border-style: solid;
            border-width: 3px 3px 0 0;
            border-top-right-radius: 20px;
        }

        .scanner-frame-bl {
            position: absolute;
            bottom: 0; left: 0;
            width: 40px; height: 40px;
            border-color: #fff;
            border-style: solid;
            border-width: 0 0 3px 3px;
            border-bottom-left-radius: 20px;
        }

        .instruction-card {
            background-color: rgba(50, 45, 40, 0.85);
            padding: 14px 20px;
            border-radius: 6px;
            color: #fff;
            font-size: 14px;
            text-align: center;
            max-width: 80%;
            margin: 0 auto;
            pointer-events: auto;
        }

        .bottom-bar {
            padding: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: auto;
            margin-bottom: 30px;
        }

        .scan-btn {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background-color: transparent;
            border: 2px solid #ff4c4c;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            position: relative;
        }

        .scan-btn::after {
            content: '';
            position: absolute;
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background-color: #ff4c4c;
            opacity: 0.2;
        }

        .scan-icon {
            width: 28px;
            height: 28px;
            stroke: #ff4c4c;
            stroke-width: 1.5;
            z-index: 2;
        }

        /* Loading Screen Overlay */
        .loading-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            display: none;
            color: white;
            backdrop-filter: blur(5px);
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid #fff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 16px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error-message {
            position: absolute;
            top: 24px;
            left: 50%;
            transform: translateX(-50%);
            background: #ff4c4c;
            color: #fff;
            padding: 12px 20px;
            border-radius: 8px;
            z-index: 100;
            display: none;
            text-align: center;
            width: 80%;
            font-size: 14px;
        }

    </style>
</head>
<body>
<div class="camera-app-wrapper">

    <!-- Camera Feed -->
    <video id="camera-feed" autoplay playsinline></video>
    
    <!-- Hidden Canvas for capturing frames -->
    <canvas id="capture-canvas" style="display:none;"></canvas>

    <div class="error-message" id="error-msg">Camera access denied. Please enable permissions.</div>

    <div class="overlay">
        <!-- Top Bar -->
        <div class="top-bar">
            <button class="close-btn" onclick="goBack()">
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M18 6L6 18M6 6L18 18" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </button>
        </div>

        <!-- Center Scanning Frame -->
        <div class="scanner-container">
            <div class="scanner-frame">
                <div class="scanner-frame-tr"></div>
                <div class="scanner-frame-bl"></div>
            </div>

            <div class="instruction-card">
                Search for an item by scan product or QR
            </div>
        </div>

        <!-- Bottom Action Bar -->
        <div class="bottom-bar">
            <button class="scan-btn" onclick="captureAndSearch()" id="scan-btn">
                <svg class="scan-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M4 7V5C4 4.44772 4.44772 4 5 4H7M17 4H19C19.5523 4 20 4.44772 20 5V7M4 17V19C4 19.5523 4.44772 20 5 20H7M17 20H19C19.5523 20 20 19.5523 20 19V17" stroke-linecap="round" stroke-linejoin="round"/>
                    <rect x="7" y="11" width="10" height="2" fill="#ff4c4c"/>
                </svg>
            </button>
        </div>
    </div>

    <!-- Loading State -->
    <div class="loading-overlay" id="loading-screen">
        <div class="spinner"></div>
        <div>Analyzing image...</div>
    </div>

    <script>
        const video = document.getElementById('camera-feed');
        const errorMsg = document.getElementById('error-msg');
        let stream = null;

        // Initialize Camera
        async function startCamera() {
            try {
                stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'environment' }
                });
                video.srcObject = stream;
            } catch (err) {
                console.error("Error accessing camera:", err);
                errorMsg.style.display = 'block';
                errorMsg.innerText = "Camera access denied. Please enable permissions to use visual search.";
            }
        }

        function stopCamera() {
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
            }
        }

        function goBack() {
            stopCamera();
            window.history.back();
        }

        function captureAndSearch() {
            if (!stream) return;

            // Show loading
            document.getElementById('loading-screen').style.display = 'flex';

            const canvas = document.getElementById('capture-canvas');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            // Get base64 JPEG
            const dataUrl = canvas.toDataURL('image/jpeg', 0.8);

            // Send to backend
            fetch('{% url "api_camera_search" %}', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': '{{ csrf_token }}'
                },
                body: JSON.stringify({ image: dataUrl })
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    if (data.type === 'qr') {
                        // Attempt to parse QR code
                        let qr = data.data;
                        if (qr.includes('/customer-product/')) {
                            window.location.href = qr;
                        } else {
                            window.location.href = '{% url "customer_search" %}?q=' + encodeURIComponent(qr);
                        }
                    } else if (data.type === 'visual') {
                        if (data.no_match) {
                            window.location.href = '{% url "customer_search" %}?q=__NO_MATCH__';
                        } else if (data.exact_match) {
                            window.location.href = data.url;
                        } else {
                            window.location.href = '{% url "customer_search" %}?q=Visual Search&ids=' + data.ids.join(',');
                        }
                    }
                } else {
                    document.getElementById('loading-screen').style.display = 'none';
                    alert("Analysis failed: " + data.error);
                }
            })
            .catch(err => {
                console.error(err);
                document.getElementById('loading-screen').style.display = 'none';
                alert("Network error occurred.");
            });
        }

        // Start camera on load
        window.addEventListener('load', startCamera);
        window.addEventListener('beforeunload', stopCamera);
    </script>
</div>
</body>
</html>
