{% extends 'base/outer_base.html' %} 
{% load static %} 

{% block title%}Welcome{% endblock %}

{% block styles %}
  <link rel="stylesheet" href="{% static 'css/success/success.css' %}">
  <style>
    .splash-content {
      text-align: center;
      animation: fadeIn 0.8s ease;
    }
    .success-image {
      width: 120px;
      height: 120px;
      margin-bottom: 24px;
      animation: popIn 0.7s cubic-bezier(.68,-0.55,.27,1.55);
    }
    .success-heading {
      font-size: 2.2em;
      font-weight: 700;
      color: #22c55e;
      margin-bottom: 12px;
      letter-spacing: 0.03em;
    }
    .success-subtext {
      font-size: 1.1em;
      color: #374151;
      margin-bottom: 8px;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }
    @keyframes popIn {
      0% { transform: scale(0.7); opacity: 0; }
      80% { transform: scale(1.1); opacity: 1; }
      100% { transform: scale(1); }
    }
  </style>
{% endblock styles %}

{% block content %}
  <div class="splash-screen">
    <div class="splash-content">
      <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 60vh;">
        <img src="{% static 'images/account/success.png' %}" class="success-image" />
        <h1 class="success-heading">Success!</h1>
        <p class="success-subtext">Your account has been created.</p>
        {% if user.is_authenticated %}
          <p class="success-subtext">Welcome, {{ user.mobile }}!</p>
        {% endif %}
      </div>
    </div>
  </div>
  <script>
    // Auto-redirect after 2.5 seconds
    setTimeout(function() {
      window.location.href = '/customer-home/';
    }, 2500);
  </script>
{% endblock content %}
