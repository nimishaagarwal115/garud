{% extends "base/base.html" %}
{% load static %}
{% block title %}Garud | Registration Successful{% endblock %}

{% block All_Content %}
<div class="d-flex flex-column align-items-center justify-content-center px-4" style="min-height: 100vh; background-color: #ffffff;">
    
    <div class="w-100 text-center" style="max-width: 400px;">
        
        <!-- Success Illustration -->
        <div class="mb-5">
            <img src="{% static 'images/account/success.png' %}" alt="Registration Successful" class="img-fluid" style="max-width: 250px;">
        </div>

        <h2 class="mb-3" style="font-weight: 700; color: #333;" data-translate="registration_successful">सफलता</h2>
        
        <p class="text-muted mb-5" style="font-size: 1.1rem;" data-translate="account_created">
            आपका खाता सफलतापूर्वक खुल गया है
        </p>

        <a href="{% url 'product_list' %}" class="btn btn-danger w-100 py-3" style="font-size: 1.1rem; border-radius: 8px;" data-translate="continue">आगे बढ़े</a>
    </div>

</div>
{% endblock %}
