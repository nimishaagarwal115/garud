{% extends 'base/outer_base.html' %}
{% load static %}

{% block title %}Successfully{% endblock %}

{% block styles %}
<style>
    body {
        font-family: 'Inter', sans-serif;
        background-color: #ffffff;
    }
    .auth-container {
        max-width: 480px;
        margin: 0 auto;
        padding: 40px 24px;
        text-align: center;
        background-color: #ffffff;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
    }
    .auth-illustration-container {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 35vh; /* slightly larger for success */
        margin-bottom: 30px;
    }
    .auth-illustration {
        max-width: 100%;
        max-height: 100%;
        object-fit: contain;
    }
    .auth-title {
        font-size: 28px;
        font-weight: 700;
        color: #1a1a1a; /* N90 */
        margin-bottom: 12px;
    }
    .auth-desc {
        font-size: 14px;
        color: #666666; /* N60 */
        line-height: 1.5;
    }
</style>
<script>
    // Redirect to Customer Home page after 2.5 seconds
    setTimeout(function() {
        window.location.href = "{% url 'customer_home' %}";
    }, 2500);
</script>
{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-illustration-container">
        <img src="{% static 'images/account/success.png' %}" alt="Success" class="auth-illustration">
    </div>
    <h1 class="auth-title">Successfully</h1>
    <p class="auth-desc">Your account has been created.</p>
</div>
{% endblock %}
