{% extends 'base/outer_base.html' %}
{% load static %}

{% block title %}Login and Security{% endblock %}

{% block styles %}
<style>
    body {
        font-family: 'Inter', sans-serif;
        background-color: #ffffff;
    }
    .security-container {
        max-width: 480px;
        margin: 0 auto;
        padding: 24px;
        background-color: #ffffff;
        min-height: calc(100vh - 60px);
    }
    .page-title {
        font-size: 22px;
        font-weight: 600;
        color: #1a1a1a;
        margin-bottom: 24px;
    }
    .form-group {
        margin-bottom: 20px;
    }
    .form-label {
        display: block;
        font-size: 14px;
        font-weight: 600;
        color: #1a1a1a;
        margin-bottom: 8px;
    }
    .input-wrapper {
        position: relative;
        display: flex;
        align-items: center;
    }
    .form-control {
        width: 100%;
        height: 48px;
        border-radius: 8px;
        border: 1px solid #e0e0e0;
        background-color: #ffffff;
        padding: 0 40px 0 16px;
        font-size: 16px;
        color: #424242;
        box-sizing: border-box;
    }
    .form-control:focus {
        outline: none;
        border-color: #d94b2b;
    }
    .form-control:disabled {
        background-color: #e0e0e0;
        color: #757575;
        border-color: #e0e0e0;
        padding-right: 16px;
    }
    .edit-icon {
        position: absolute;
        right: 16px;
        color: #9e9e9e;
        font-size: 18px;
        pointer-events: none;
    }
    .btn-save {
        display: block;
        width: 100%;
        padding: 16px;
        background-color: #d94b2b;
        color: #ffffff;
        font-size: 16px;
        font-weight: 600;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        margin-top: 32px;
        text-align: center;
        transition: background-color 0.2s;
    }
    .btn-save:hover {
        background-color: #c24127;
    }
    .alert {
        padding: 12px 16px;
        border-radius: 8px;
        margin-bottom: 20px;
        font-size: 14px;
    }
    .alert-success {
        background-color: #d4edda;
        color: #155724;
        border: 1px solid #c3e6cb;
    }
</style>
{% endblock %}

{% block content %}
<div class="security-container">
    <h1 class="page-title">Login and Security</h1>
    
    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-{{ message.tags }}">
                {{ message }}
            </div>
        {% endfor %}
    {% endif %}

    <form method="POST" action="{% url 'customer_login_security' %}">
        {% csrf_token %}
        
        <div class="form-group">
            <label class="form-label">Full Name</label>
            <div class="input-wrapper">
                <input type="text" name="fullname" class="form-control" value="{{ request.user.fullname|default:'' }}" placeholder="John Doe">
                <i class="bi bi-pencil-square edit-icon"></i>
            </div>
        </div>
        
        <div class="form-group">
            <label class="form-label">Mobile No.</label>
            <div class="input-wrapper">
                <input type="text" class="form-control" value="{{ request.user.mobile }}" disabled>
            </div>
        </div>
        
        <div class="form-group">
            <label class="form-label">Email</label>
            <div class="input-wrapper">
                <input type="email" name="email" class="form-control" value="{{ request.user.email|default:'' }}" placeholder="johndoe@gmail.com">
                <i class="bi bi-pencil-square edit-icon"></i>
            </div>
        </div>
        
        <button type="submit" class="btn-save">Save</button>
    </form>
</div>
{% endblock %}
