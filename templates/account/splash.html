{% extends "base/base.html" %}
{% load static %}

{% block title %}Garuda | Welcome{% endblock %}

{% block All_Content %}
<div class="d-flex flex-column justify-content-center align-items-center mx-auto" style="height: 100vh; max-width: 480px; width: 100%; background-color: #fff; margin: 0; padding: 0;">
    <img src="{% static 'images/favicon/splash-logo-android-universal.png' %}" alt="Garud Splash" style="width: 100%; height: 100%; object-fit: cover;">
</div>

<script>
    // Redirect to Language Selection after 2 seconds
    setTimeout(function() {
        window.location.href = "{% url 'language_preference_ajax' %}";
    }, 2000);
</script>
{% endblock All_Content %}
